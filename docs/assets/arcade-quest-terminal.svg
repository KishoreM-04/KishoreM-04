<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="hudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914"/>
      <stop offset="50%" stop-color="#081328"/>
      <stop offset="100%" stop-color="#02050B"/>
    </linearGradient>

    <!-- Energy Gradients -->
    <linearGradient id="barCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="crystalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>

    <!-- Laser and Neon Filters -->
    <filter id="laserGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", Consolas, -apple-system, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* Patrolling AI Drone Hover */
    .patrol-drone {
      animation: droneFloat 4s ease-in-out infinite alternate;
    }
    @keyframes droneFloat {
      0%   { transform: translateY(0px) rotate(0deg); }
      50%  { transform: translateY(-12px) rotate(2.5deg); }
      100% { transform: translateY(5px) rotate(-2deg); }
    }

    /* Laser Eye Scanner Sweep */
    .laser-scanner {
      animation: laserSweep 3s ease-in-out infinite alternate;
    }
    @keyframes laserSweep {
      0%   { transform: rotate(-16deg); opacity: 0.35; }
      100% { transform: rotate(22deg); opacity: 0.95; }
    }

    /* Reactor Core Rotation */
    .reactor-spinner {
      animation: spinCore 8s linear infinite;
    }
    @keyframes spinCore {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .counter-spin {
      animation: spinCounter 12s linear infinite;
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to   { transform: rotate(0deg); }
    }

    /* Quest Clear Pulses */
    .quest-pulse {
      animation: questPulseAnim 2.5s infinite ease-in-out alternate;
    }
    @keyframes questPulseAnim {
      0%   { opacity: 0.55; }
      100% { opacity: 1; filter: drop-shadow(0 0 6px #00F5A0); }
    }

    /* EXP Bar Shimmer */
    .exp-shimmer {
      animation: shimmer 3s ease-in-out infinite alternate;
    }
    @keyframes shimmer {
      0%   { opacity: 0.7; }
      100% { opacity: 1; filter: drop-shadow(0 0 5px #00F2FE); }
    }

    @media (prefers-reduced-motion: reduce) {
      .patrol-drone, .laser-scanner, .reactor-spinner, .counter-spin, .quest-pulse, .exp-shimmer {
        animation: none !important;
      }
    }
  </style>

  <!-- Outer Cyberpunk Arcade Chassis -->
  <rect width="880" height="340" rx="16" fill="url(#hudBg)" stroke="rgba(0, 242, 254, 0.45)" stroke-width="1.8"/>

  <!-- Cybernetic Grid Backdrop -->
  <g opacity="0.06" stroke="#00F2FE" stroke-width="0.8">
    <line x1="0" y1="85" x2="880" y2="85"/>
    <line x1="0" y1="170" x2="880" y2="170"/>
    <line x1="0" y1="255" x2="880" y2="255"/>
    <line x1="220" y1="0" x2="220" y2="340"/>
    <line x1="440" y1="0" x2="440" y2="340"/>
    <line x1="660" y1="0" x2="660" y2="340"/>
  </g>

  <!-- Corner Brackets -->
  <path d="M 12 36 L 12 12 L 36 12" stroke="#00F2FE" stroke-width="3" fill="none"/>
  <path d="M 868 36 L 868 12 L 844 12" stroke="#00F2FE" stroke-width="3" fill="none"/>
  <path d="M 12 304 L 12 328 L 36 328" stroke="#00F2FE" stroke-width="3" fill="none"/>
  <path d="M 868 304 L 868 328 L 844 328" stroke="#00F2FE" stroke-width="3" fill="none"/>

  <!-- Top Arcade Marquee Header -->
  <g transform="translate(36, 32)">
    <rect width="20" height="20" rx="4" fill="#00F2FE" opacity="0.15"/>
    <text x="10" y="15" text-anchor="middle" fill="#00F2FE" font-size="12">🎮</text>
    <text x="32" y="15" fill="#00F2FE" class="mono" font-size="13" font-weight="800" letter-spacing="0.1em">DEVELOPER QUEST TERMINAL // KISHORE_OS v4.2</text>
    
    <rect x="670" y="-4" width="138" height="24" rx="4" fill="rgba(0,245,160,0.12)" stroke="rgba(0,245,160,0.5)" stroke-width="1"/>
    <circle cx="682" cy="8" r="3.5" fill="#00F5A0" class="quest-pulse"/>
    <text x="744" y="13" text-anchor="middle" fill="#00F5A0" class="mono" font-size="10.5" font-weight="700">STATUS: S-RANK ACTIVE</text>
  </g>

  <!-- Horizontal Divider Line -->
  <line x1="36" y1="56" x2="844" y2="56" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- 1. LEFT: Interactive Patrolling AI Security Bot (SENTINEL-01) -->
  <g transform="translate(105, 175)" class="patrol-drone">
    <!-- Laser Sight Scanner (Rotates around drone eye 0,0) -->
    <g class="laser-scanner">
      <line x1="0" y1="0" x2="95" y2="85" stroke="#00F2FE" stroke-width="1.8" stroke-dasharray="4 6" opacity="0.7"/>
      <circle cx="95" cy="85" r="3.5" fill="#00F2FE" filter="url(#laserGlow)"/>
    </g>

    <!-- Orbital Gyro Rings around Bot -->
    <ellipse cx="0" cy="0" rx="46" ry="16" stroke="#7F00FF" stroke-width="1.6" stroke-dasharray="6 8" fill="none"/>
    <ellipse cx="0" cy="0" rx="38" ry="38" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" fill="none"/>

    <!-- Drone Body Chassis -->
    <circle cx="0" cy="0" r="32" fill="#0F172A" stroke="#00F2FE" stroke-width="2.2"/>
    <circle cx="0" cy="0" r="26" fill="#030712"/>
    
    <!-- Glowing Visor Eye Assembly -->
    <rect x="-18" y="-9" width="36" height="18" rx="8" fill="#020617" stroke="#38BDF8" stroke-width="1.2"/>
    <circle cx="-8" cy="0" r="4" fill="#00F2FE" filter="url(#laserGlow)"/>
    <circle cx="8" cy="0" r="4" fill="#00F2FE" filter="url(#laserGlow)"/>
    
    <!-- Antenna Telemetry Node -->
    <line x1="0" y1="-32" x2="0" y2="-44" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-45" r="3.5" fill="#00F5A0" filter="url(#laserGlow)"/>

    <!-- Plasma Thrusters Pulse -->
    <path d="M -10 30 Q 0 48 10 30 Z" fill="#00F2FE" opacity="0.85"/>

    <!-- Bot Name Badge -->
    <text x="0" y="65" text-anchor="middle" fill="#38BDF8" class="mono" font-size="10" font-weight="700">SENTINEL-01</text>
    <text x="0" y="77" text-anchor="middle" fill="#64748B" class="mono" font-size="8.5">AI SCOUT // REPO SCANNER</text>
  </g>

  <!-- 2. CENTER: Player Stats and Quest Accomplishments HUD -->
  <g transform="translate(195, 72)">
    <!-- Character Attributes Card -->
    <rect width="320" height="98" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <text x="14" y="24" fill="#FFFFFF" class="sans" font-size="13" font-weight="800">PLAYER: KISHORE M</text>
    <text x="175" y="24" fill="#00F2FE" class="mono" font-size="11" font-weight="700">[LVL 24 · ARCHITECT]</text>
    <text x="14" y="41" fill="#94A3B8" class="sans" font-size="10.5">MCA Scholar @ Rajagiri · Full-Stack &amp; Embedded Systems</text>

    <!-- Energy / Mana / Skill EXP Bars -->
    <g transform="translate(14, 55)">
      <!-- Django / Backend -->
      <text y="0" fill="#CBD5E1" class="mono" font-size="9" font-weight="600">DJANGO / BACKEND</text>
      <rect x="115" y="-8" width="150" height="8" rx="4" fill="#1E293B"/>
      <rect x="115" y="-8" width="144" height="8" rx="4" fill="url(#barCyan)" class="exp-shimmer"/>
      <text x="272" y="-1" fill="#00F2FE" class="mono" font-size="8.5" font-weight="700">96%</text>

      <!-- Android and IoT -->
      <text y="17" fill="#CBD5E1" class="mono" font-size="9" font-weight="600">ANDROID &amp; IOT</text>
      <rect x="115" y="9" width="150" height="8" rx="4" fill="#1E293B"/>
      <rect x="115" y="9" width="135" height="8" rx="4" fill="url(#barGreen)" class="exp-shimmer"/>
      <text x="272" y="16" fill="#00F5A0" class="mono" font-size="8.5" font-weight="700">90%</text>

      <!-- AI and Research -->
      <text y="34" fill="#CBD5E1" class="mono" font-size="9" font-weight="600">AI &amp; RESEARCH</text>
      <rect x="115" y="26" width="150" height="8" rx="4" fill="#1E293B"/>
      <rect x="115" y="26" width="132" height="8" rx="4" fill="url(#barPurple)" class="exp-shimmer"/>
      <text x="272" y="33" fill="#C084FC" class="mono" font-size="8.5" font-weight="700">88%</text>
    </g>

    <!-- Active Quest Accomplishments HUD -->
    <g transform="translate(0, 108)">
      <rect width="320" height="136" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="14" y="22" fill="#00F5A0" class="mono" font-size="11" font-weight="700">⚔️ QUEST ACHIEVEMENTS UNLOCKED:</text>

      <!-- Quest 1 -->
      <g transform="translate(14, 42)">
        <circle cx="4" cy="-3" r="3.5" fill="#00F5A0" class="quest-pulse"/>
        <text x="16" y="0" fill="#F1F5F9" class="sans" font-size="10.5" font-weight="600">Mentrix Institutional Platform</text>
        <text x="290" y="0" text-anchor="end" fill="#00F5A0" class="mono" font-size="9.5" font-weight="700">[CLEARED]</text>
      </g>

      <!-- Quest 2 -->
      <g transform="translate(14, 66)">
        <circle cx="4" cy="-3" r="3.5" fill="#00F5A0" class="quest-pulse"/>
        <text x="16" y="0" fill="#F1F5F9" class="sans" font-size="10.5" font-weight="600">Air Quality Robot Telemetry (EcoBreath)</text>
        <text x="290" y="0" text-anchor="end" fill="#00F5A0" class="mono" font-size="9.5" font-weight="700">[CLEARED]</text>
      </g>

      <!-- Quest 3 -->
      <g transform="translate(14, 90)">
        <circle cx="4" cy="-3" r="3.5" fill="#00F5A0" class="quest-pulse"/>
        <text x="16" y="0" fill="#F1F5F9" class="sans" font-size="10.5" font-weight="600">Cloud TaskFlow PaaS on Railway</text>
        <text x="290" y="0" text-anchor="end" fill="#00F5A0" class="mono" font-size="9.5" font-weight="700">[CLEARED]</text>
      </g>

      <!-- Quest 4 -->
      <g transform="translate(14, 114)">
        <circle cx="4" cy="-3" r="3.5" fill="#C084FC" class="quest-pulse"/>
        <text x="16" y="0" fill="#F1F5F9" class="sans" font-size="10.5" font-weight="600">Publish 2 International Research Papers</text>
        <text x="290" y="0" text-anchor="end" fill="#C084FC" class="mono" font-size="9.5" font-weight="700">[2 PAPERS]</text>
      </g>
    </g>
  </g>

  <!-- 3. RIGHT: Animated Cyber Power Reactor and Telemetry Specs -->
  <g transform="translate(535, 72)">
    <rect width="310" height="244" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <text x="18" y="24" fill="#38BDF8" class="mono" font-size="11" font-weight="700">CORE REACTOR // TELEMETRY</text>
    <text x="18" y="38" fill="#64748B" class="mono" font-size="8.5">NEURAL POWER MATRIX OPTIMAL</text>

    <!-- Animated Core Reactor Assembly (Centered perfectly at local 235, 120) -->
    <g transform="translate(235, 120)">
      <!-- Outer Gyro Ring (Rotating Clockwise) -->
      <g class="reactor-spinner">
        <circle cx="0" cy="0" r="42" stroke="url(#crystalGlow)" stroke-width="2" stroke-dasharray="14 10 24 8" fill="none"/>
        <circle cx="0" cy="-42" r="3" fill="#00F2FE"/>
        <circle cx="42" cy="0" r="3" fill="#00F5A0"/>
        <circle cx="0" cy="42" r="3" fill="#7F00FF"/>
      </g>

      <!-- Counter-Rotating Inner Ring -->
      <g class="counter-spin">
        <circle cx="0" cy="0" r="30" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 8" fill="none"/>
      </g>

      <!-- Crystal Hexagon -->
      <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" stroke="#00F2FE" stroke-width="1.8" fill="#0B132B" opacity="0.9"/>

      <!-- Glowing Core Plasma -->
      <circle cx="0" cy="0" r="8" fill="#00F5A0" filter="url(#laserGlow)"/>
    </g>

    <!-- Telemetry Data Readout -->
    <g transform="translate(18, 64)">
      <g transform="translate(0, 0)">
        <text fill="#64748B" class="mono" font-size="8.5">DATABASE PROTOCOL</text>
        <text y="15" fill="#FFFFFF" class="mono" font-size="11" font-weight="600">MySQL / PostgreSQL / SQLite</text>
      </g>

      <g transform="translate(0, 38)">
        <text fill="#64748B" class="mono" font-size="8.5">SYSTEM RUNTIMES</text>
        <text y="15" fill="#00F2FE" class="mono" font-size="11" font-weight="600">Python 3.11 · Java SDK · Dart</text>
      </g>

      <g transform="translate(0, 76)">
        <text fill="#64748B" class="mono" font-size="8.5">LOCAL AI INFERENCE</text>
        <text y="15" fill="#C084FC" class="mono" font-size="11" font-weight="600">Ollama LLMs (On-Premise Privacy)</text>
      </g>

      <g transform="translate(0, 114)">
        <text fill="#64748B" class="mono" font-size="8.5">SECURITY ARCHITECTURE</text>
        <text y="15" fill="#00F5A0" class="mono" font-size="11" font-weight="600">Single-Session Guard + OAuth2</text>
      </g>

      <g transform="translate(0, 150)">
        <rect width="165" height="20" rx="4" fill="rgba(0,242,254,0.08)" stroke="rgba(0,242,254,0.3)" stroke-width="0.8"/>
        <text x="82" y="14" text-anchor="middle" fill="#38BDF8" class="mono" font-size="8.5" font-weight="700">⚡ MULTI-TENANT RBAC ONLINE</text>
      </g>
    </g>
  </g>
</svg>