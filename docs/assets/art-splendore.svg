<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>
    <filter id="festiveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .notif-banner {
      animation: slideInNotif 4s ease-in-out infinite alternate;
    }
    @keyframes slideInNotif {
      0%   { transform: translateY(-4px); opacity: 0.85; }
      100% { transform: translateY(4px); opacity: 1; }
    }
    .circular-frame {
      animation: rotateFestiveFrame 16s linear infinite;
      transform-origin: 155px 175px;
    }
    @keyframes rotateFestiveFrame {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .shutter-glow {
      animation: shutterPulse 2s infinite ease-in-out;
    }
    @keyframes shutterPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px #00F2FE); }
    }
    @media (prefers-reduced-motion: reduce) {
      .notif-banner, .circular-frame, .shutter-glow { animation: none !important; }
    }
  </style>

  <!-- Background Base -->
  <rect width="600" height="320" rx="14" fill="#060A13" stroke="rgba(127, 0, 255, 0.3)" stroke-width="1.5"/>

  <!-- Left: Stylized Mobile Device -->
  <g transform="translate(60, 20)">
    <!-- Device Outer Chassis -->
    <rect width="190" height="280" rx="28" fill="url(#phoneBg)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <!-- Speaker and Sensor Bar -->
    <rect x="75" y="10" width="40" height="4" rx="2" fill="#334155"/>
    <circle cx="125" cy="12" r="2" fill="#00F2FE"/>

    <!-- Screen Bezel Screen -->
    <rect x="10" y="24" width="170" height="234" rx="18" fill="#030712"/>

    <!-- Circular Camera Photo-Booth Viewfinder -->
    <circle cx="95" cy="120" r="54" fill="#09101D" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
    
    <!-- Rotating Festive Frame Overlay Motif -->
    <g class="circular-frame">
      <circle cx="95" cy="120" r="50" stroke="url(#frameGrad)" stroke-width="2.5" stroke-dasharray="14 10 30 8"/>
      <circle cx="145" cy="120" r="3" fill="#00F2FE"/>
      <circle cx="45" cy="120" r="3" fill="#7F00FF"/>
      <circle cx="95" cy="70" r="3" fill="#00F5A0"/>
    </g>

    <!-- Camera Crosshairs -->
    <circle cx="95" cy="120" r="24" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" fill="none"/>
    <circle cx="95" cy="120" r="4" fill="#00F2FE" opacity="0.6"/>

    <!-- Shutter Button -->
    <circle cx="95" cy="208" r="16" fill="#0F172A" stroke="#00F2FE" stroke-width="2" class="shutter-glow"/>
    <circle cx="95" cy="208" r="11" fill="#00F2FE"/>
  </g>

  <!-- Right: Event Schedules and Live Reminders HUD -->
  <g transform="translate(280, 40)">
    <!-- Fest Header Tag -->
    <rect width="150" height="24" rx="6" fill="rgba(127, 0, 255, 0.15)" stroke="rgba(127, 0, 255, 0.4)" stroke-width="1"/>
    <text x="12" y="16" fill="#C084FC" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.05em">SPLENDORE 2025 // FEST TECH</text>

    <!-- Reminder Notification Card -->
    <g transform="translate(0, 40)" class="notif-banner">
      <rect width="260" height="58" rx="10" fill="#0B1324" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1"/>
      <text x="14" y="22" font-size="14">🔔</text>
      <text x="36" y="20" fill="#FFFFFF" font-family="sans-serif" font-size="11.5" font-weight="700">Event Reminder Triggered</text>
      <text x="36" y="34" fill="#00F5A0" font-family="sans-serif" font-size="10" font-weight="600">Coding Marathon · Lab 03</text>
      <text x="36" y="47" fill="#64748B" font-family="sans-serif" font-size="9">Begins in 15 minutes · Alarm Set</text>
    </g>

    <!-- Live Event Schedule Rows -->
    <g transform="translate(0, 114)">
      <rect width="260" height="42" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#00F2FE"/>
      <text x="34" y="19" fill="#F1F5F9" font-family="sans-serif" font-size="11" font-weight="600">Digital Photobooth Session</text>
      <text x="34" y="32" fill="#94A3B8" font-family="sans-serif" font-size="9">Central Courtyard · Custom Frame Overlays</text>

      <rect y="52" width="260" height="42" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      <circle cx="20" cy="73" r="4" fill="#A855F7"/>
      <text x="34" y="71" fill="#F1F5F9" font-family="sans-serif" font-size="11" font-weight="600">Robotics Challenge Showcase</text>
      <text x="34" y="84" fill="#94A3B8" font-family="sans-serif" font-size="9">Auditorium Main Stage · 02:00 PM</text>
    </g>

    <!-- APK Release Indicator -->
    <g transform="translate(0, 222)">
      <text fill="#00F5A0" font-family="sans-serif" font-size="10" font-weight="700">📦 Tested Native Android Package · Splendore.apk Included</text>
    </g>
  </g>
</svg>
