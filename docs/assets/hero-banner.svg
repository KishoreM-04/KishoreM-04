<svg fill="none" viewBox="0 0 900 340" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroDeckBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="40%" stop-color="#060E20"/>
      <stop offset="100%" stop-color="#02050D"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .cyberdeck-wrap {
          position: relative;
          width: 100%;
          height: 340px;
          background: #030712;
          background: radial-gradient(circle at 85% 15%, rgba(127, 0, 255, 0.25) 0%, transparent 45%),
                      radial-gradient(circle at 10% 85%, rgba(0, 242, 254, 0.2) 0%, transparent 40%),
                      linear-gradient(135deg, #030712 0%, #071024 100%);
          border-radius: 18px;
          border: 1.5px solid rgba(0, 242, 254, 0.4);
          box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 35px -10px rgba(0, 242, 254, 0.25);
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          box-sizing: border-box;
          padding: 30px 42px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .cyber-grid-mesh {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(0, 242, 254, 0.05) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
          background-size: 28px 28px;
          mask-image: radial-gradient(circle at 50% 50%, black 60%, transparent 95%);
          pointer-events: none;
        }

        /* Ambient Scanning Laser Beam */
        .ambient-laser {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          height: 2px;
          background: linear-gradient(90deg, transparent, #00F2FE, #7F00FF, transparent);
          opacity: 0.8;
          animation: scanLaser 4s ease-in-out infinite alternate;
        }
        @keyframes scanLaser {
          0% { transform: translateY(0); opacity: 0.3; }
          50% { opacity: 1; }
          100% { transform: translateY(338px); opacity: 0.3; }
        }

        /* Left Content Column */
        .left-meta {
          position: relative;
          z-index: 2;
          max-width: 530px;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }

        .hud-top-line {
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .hud-pill-tag {
          font-family: "JetBrains Mono", monospace;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.08em;
          color: #00F2FE;
          background: rgba(0, 242, 254, 0.1);
          border: 1px solid rgba(0, 242, 254, 0.35);
          padding: 4px 10px;
          border-radius: 6px;
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }

        .hud-status-live {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-size: 11px;
          font-weight: 600;
          color: #00F5A0;
          background: rgba(0, 245, 160, 0.1);
          border: 1px solid rgba(0, 245, 160, 0.3);
          padding: 4px 10px;
          border-radius: 999px;
        }

        .live-dot {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #00F5A0;
          box-shadow: 0 0 10px #00F5A0;
        }

        .name-glitch {
          margin: 0;
          font-size: 46px;
          font-weight: 800;
          letter-spacing: -0.03em;
          line-height: 1.05;
          background: linear-gradient(135deg, #FFFFFF 20%, #B8E4FF 50%, #00F2FE 80%, #C084FC 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .subtitle-spec {
          margin: 0;
          font-size: 16px;
          font-weight: 500;
          color: #94A3B8;
          line-height: 1.5;
        }
        .hi-cyan { color: #38BDF8; font-weight: 600; }
        .hi-purple { color: #C084FC; font-weight: 600; }

        .credentials-row {
          display: flex;
          align-items: center;
          gap: 12px;
          padding-top: 12px;
          border-top: 1px solid rgba(255, 255, 255, 0.08);
          font-size: 12px;
          color: #CBD5E1;
        }

        /* Right Bot Hologram Stage */
        .stage-right {
          position: relative;
          z-index: 2;
          width: 270px;
          height: 270px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }

        .drone-speech {
          background: rgba(15, 23, 42, 0.95);
          border: 1px solid #00F2FE;
          border-radius: 8px;
          padding: 6px 14px;
          font-size: 10.5px;
          font-family: "JetBrains Mono", monospace;
          color: #00F2FE;
          font-weight: 700;
          margin-bottom: 10px;
          box-shadow: 0 0 16px rgba(0, 242, 254, 0.35);
          animation: floatSpeech 4s ease-in-out infinite alternate;
        }
        @keyframes floatSpeech {
          0% { transform: translateY(0); }
          100% { transform: translateY(-4px); }
        }

        .drone-vector-art {
          width: 200px;
          height: 200px;
          animation: droneHover 4.5s ease-in-out infinite alternate;
        }
        @keyframes droneHover {
          0% { transform: translateY(0px) rotate(0deg); }
          50% { transform: translateY(-14px) rotate(2deg); }
          100% { transform: translateY(4px) rotate(-2deg); }
        }

        @media (prefers-reduced-motion: reduce) {
          .ambient-laser, .drone-speech, .drone-vector-art {
            animation: none !important;
          }
        }
      </style>

      <div class="cyberdeck-wrap">
        <div class="cyber-grid-mesh"></div>
        <div class="ambient-laser"></div>

        <!-- Left Column -->
        <div class="left-meta">
          <div class="hud-top-line">
            <span class="hud-pill-tag">⚡ CYBERNETIC DEVELOPER UNIVERSE</span>
            <span class="hud-status-live"><span class="live-dot"></span>SYSTEM ONLINE</span>
          </div>

          <h1 class="name-glitch">Kishore M</h1>

          <p class="subtitle-spec">
            Systems &amp; Full-Stack Architect · <span class="hi-cyan">MCA Candidate @ Rajagiri</span>.<br/>
            Engineering <span class="hi-cyan">Enterprise Django Ecosystems</span>, <span class="hi-purple">IoT Robotics Telemetry</span> &amp; Modern Systems.
          </p>

          <div class="credentials-row">
            <span>🎓 MCA (2027) · BCA (CGPA 8.78)</span>
            <span>•</span>
            <span>📍 Kerala, India 🇮🇳</span>
            <span>•</span>
            <span>🔬 2 Conference Papers (ISBN)</span>
          </div>
        </div>

        <!-- Right AI Companion Drone -->
        <div class="stage-right">
          <div class="drone-speech">AURA-01 // READY</div>
          <svg class="drone-vector-art" viewBox="0 0 200 200" fill="none">
            <!-- Thruster -->
            <path d="M85 145 Q100 185 115 145 Z" fill="#00F2FE" opacity="0.85"/>
            <!-- Antenna -->
            <line x1="100" y1="55" x2="100" y2="35" stroke="#64748B" stroke-width="2.5"/>
            <circle cx="100" cy="33" r="4.5" fill="#00F2FE"/>
            <!-- Body -->
            <circle cx="100" cy="95" r="46" fill="#0F172A" stroke="#00F2FE" stroke-width="2.5"/>
            <!-- Ears -->
            <rect x="46" y="80" width="10" height="28" rx="5" fill="#1E293B" stroke="#00F2FE" stroke-width="1.5"/>
            <rect x="144" y="80" width="10" height="28" rx="5" fill="#1E293B" stroke="#00F2FE" stroke-width="1.5"/>
            <!-- Visor -->
            <rect x="64" y="74" width="72" height="38" rx="14" fill="#030712" stroke="#38BDF8" stroke-width="1.8"/>
            <!-- Expressive Glowing Eyes -->
            <ellipse cx="82" cy="92" rx="9" ry="11" fill="#00F2FE"/>
            <ellipse cx="82" cy="92" rx="5" ry="7" fill="#FFFFFF"/>
            <ellipse cx="118" cy="92" rx="9" ry="11" fill="#00F2FE"/>
            <ellipse cx="118" cy="92" rx="5" ry="7" fill="#FFFFFF"/>
            <!-- Core Emblem -->
            <polygon points="100,122 106,128 100,134 94,128" fill="#00F5A0"/>
          </svg>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
