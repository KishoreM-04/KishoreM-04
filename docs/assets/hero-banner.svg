<svg fill="none" viewBox="0 0 900 340" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .hero-container {
          position: relative;
          width: 100%;
          height: 340px;
          background: #030712;
          background: radial-gradient(circle at 80% 20%, rgba(127, 0, 255, 0.22) 0%, transparent 45%),
                      radial-gradient(circle at 15% 85%, rgba(0, 242, 254, 0.18) 0%, transparent 45%),
                      linear-gradient(135deg, #040814 0%, #081124 100%);
          border-radius: 16px;
          border: 1px solid rgba(0, 242, 254, 0.35);
          box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.8);
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          box-sizing: border-box;
          padding: 34px 44px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .cyber-grid {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(0, 242, 254, 0.04) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(0, 242, 254, 0.04) 1px, transparent 1px);
          background-size: 30px 30px;
          mask-image: radial-gradient(circle at 50% 50%, black 60%, transparent 95%);
          pointer-events: none;
        }

        .left-content {
          position: relative;
          z-index: 2;
          max-width: 540px;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }

        .badge-line {
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .sys-tag {
          font-family: "JetBrains Mono", monospace;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.08em;
          color: #00F2FE;
          background: rgba(0, 242, 254, 0.1);
          border: 1px solid rgba(0, 242, 254, 0.3);
          padding: 4px 10px;
          border-radius: 6px;
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }

        .status-beacon-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-size: 11px;
          font-weight: 600;
          color: #00F5A0;
          background: rgba(0, 245, 160, 0.08);
          border: 1px solid rgba(0, 245, 160, 0.28);
          padding: 4px 10px;
          border-radius: 999px;
        }

        .beacon-dot {
          width: 7px;
          height: 7px;
          border-radius: 50%;
          background: #00F5A0;
          box-shadow: 0 0 8px #00F5A0;
        }

        .name-title {
          margin: 0;
          font-size: 44px;
          font-weight: 800;
          letter-spacing: -0.03em;
          line-height: 1.1;
          background: linear-gradient(135deg, #FFFFFF 15%, #E0F2FE 45%, #00F2FE 80%, #7F00FF 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .subtitle-line {
          margin: 0;
          font-size: 16px;
          font-weight: 500;
          color: #94A3B8;
          line-height: 1.5;
        }
        .highlight-cyan { color: #38BDF8; font-weight: 600; }
        .highlight-purple { color: #C084FC; font-weight: 600; }

        .meta-strip {
          display: flex;
          align-items: center;
          gap: 12px;
          padding-top: 10px;
          border-top: 1px solid rgba(255, 255, 255, 0.08);
          font-size: 12px;
          color: #CBD5E1;
        }

        /* Right: Interactive AI Companion Mini Hologram */
        .companion-frame {
          position: relative;
          z-index: 2;
          width: 240px;
          height: 250px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }

        .aura-speech {
          background: rgba(15, 23, 42, 0.9);
          border: 1px solid rgba(0, 242, 254, 0.4);
          border-radius: 8px;
          padding: 6px 12px;
          font-size: 10.5px;
          font-family: "JetBrains Mono", monospace;
          color: #00F2FE;
          font-weight: 600;
          margin-bottom: 8px;
          box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
          animation: speechFloat 4s ease-in-out infinite alternate;
        }

        @keyframes speechFloat {
          0% { transform: translateY(0); }
          100% { transform: translateY(-4px); }
        }

        .aura-bot-img {
          width: 170px;
          height: 170px;
          animation: floatAura 5s ease-in-out infinite alternate;
        }
        @keyframes floatAura {
          0% { transform: translateY(0px) rotate(0deg); }
          100% { transform: translateY(-12px) rotate(2deg); }
        }

        @media (prefers-reduced-motion: reduce) {
          .aura-speech, .aura-bot-img { animation: none !important; }
        }
      </style>

      <div class="hero-container">
        <div class="cyber-grid"></div>

        <!-- Left Information Column -->
        <div class="left-content">
          <div class="badge-line">
            <span class="sys-tag">⚡ NEXT-GEN AI DEVELOPER UNIVERSE</span>
            <span class="status-beacon-pill"><span class="beacon-dot"></span>SYSTEMS OPTIMAL</span>
          </div>

          <h1 class="name-title">Kishore M</h1>

          <p class="subtitle-line">
            Software Developer &amp; <span class="highlight-cyan">MCA Candidate @ Rajagiri Social Sciences</span>.<br/>
            Engineering <span class="highlight-cyan">Enterprise Django Platforms</span>, <span class="highlight-purple">IoT Robotics</span> &amp; Modern Systems.
          </p>

          <div class="meta-strip">
            <span>🎓 MCA (2027) · BCA (CGPA 8.78)</span>
            <span>•</span>
            <span>📍 Kerala, India 🇮🇳</span>
            <span>•</span>
            <span>🧠 2 Published Papers</span>
          </div>
        </div>

        <!-- Right AI Companion Signature Showcase -->
        <div class="companion-frame">
          <div class="aura-speech">AURA // NEURAL ONLINE</div>
          <!-- Integrated Vector AI Robot -->
          <svg class="aura-bot-img" viewBox="0 0 200 200" fill="none">
            <!-- Bot Thruster -->
            <path d="M85 145 Q100 180 115 145 Z" fill="#00F2FE" opacity="0.8"/>
            <!-- Antenna -->
            <line x1="100" y1="55" x2="100" y2="35" stroke="#64748B" stroke-width="2.5"/>
            <circle cx="100" cy="33" r="4" fill="#00F2FE"/>
            <!-- Body -->
            <circle cx="100" cy="95" r="46" fill="#0F172A" stroke="#00F2FE" stroke-width="2"/>
            <!-- Ears -->
            <rect x="48" y="80" width="8" height="26" rx="4" fill="#1E293B" stroke="#00F2FE" stroke-width="1.5"/>
            <rect x="144" y="80" width="8" height="26" rx="4" fill="#1E293B" stroke="#00F2FE" stroke-width="1.5"/>
            <!-- Visor -->
            <rect x="64" y="74" width="72" height="38" rx="14" fill="#030712" stroke="#38BDF8" stroke-width="1.5"/>
            <!-- Expressive Eyes with Blink Animation -->
            <g style="transform-origin: 100px 92px; animation: eyeBlink 5s infinite;">
              <ellipse cx="82" cy="92" rx="9" ry="11" fill="#00F2FE"/>
              <ellipse cx="82" cy="92" rx="5" ry="7" fill="#FFFFFF"/>
              <ellipse cx="118" cy="92" rx="9" ry="11" fill="#00F2FE"/>
              <ellipse cx="118" cy="92" rx="5" ry="7" fill="#FFFFFF"/>
            </g>
            <!-- Core -->
            <polygon points="100,122 106,128 100,134 94,128" fill="#00F5A0"/>
          </svg>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
