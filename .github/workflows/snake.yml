name: Generate Contribution Snake Animation

on:
  schedule:
    # Run once every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Contribution Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: KishoreM-04
          outputs: |
            assets/github-contribution-snake.svg
            assets/github-contribution-snake-dark.svg?palette=github-dark&color_snake=#00F5A0&color_dots=#0D1322,#064E3B,#047857,#10B981,#00F5A0

      - name: Commit and Push Generated Assets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-snake.svg assets/github-contribution-snake-dark.svg
          if git diff --staged --quiet; then
            echo "No contribution graph changes to commit."
          else
            git commit -m "chore(telemetry): auto-update contribution snake animation [skip ci]"
            git push
          fi
