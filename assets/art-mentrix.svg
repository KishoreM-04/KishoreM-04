<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mentrixArtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1C"/>
      <stop offset="100%" stop-color="#03060C"/>
    </linearGradient>
    <linearGradient id="cyanPurpleFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#7F00FF"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>
    <filter id="artGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    .node-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 9.5px; fill: #94A3B8; }
    .data-flow-line {
      stroke-dasharray: 6 10;
      animation: dashMove 6s linear infinite;
    }
    @keyframes dashMove {
      from { stroke-dashoffset: 64; }
      to   { stroke-dashoffset: 0; }
    }
    .pulse-core {
      animation: pulseCore 2.5s ease-in-out infinite alternate;
    }
    @keyframes pulseCore {
      0%   { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.6)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .data-flow-line, .pulse-core { animation: none !important; }
    }
  </style>

  <!-- Background Card Canvas -->
  <rect width="600" height="320" rx="14" fill="url(#mentrixArtBg)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1.5"/>

  <!-- Background Grid -->
  <g opacity="0.08" stroke="#00F2FE" stroke-width="0.75">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="450" y1="0" x2="450" y2="320"/>
  </g>

  <!-- Flow Lines -->
  <!-- Student to Core -->
  <path d="M 120 160 C 200 160, 220 160, 300 160" stroke="url(#cyanPurpleFlow)" stroke-width="2.5" class="data-flow-line"/>
  <!-- Faculty to Core -->
  <path d="M 480 160 C 400 160, 380 160, 300 160" stroke="url(#cyanPurpleFlow)" stroke-width="2.5" class="data-flow-line"/>
  <!-- Core to HOD/Admin (Top) -->
  <path d="M 300 160 L 300 70" stroke="rgba(0, 242, 254, 0.5)" stroke-width="2" class="data-flow-line"/>
  <!-- Core to ReportLab / AI Engine (Bottom) -->
  <path d="M 300 160 L 300 250" stroke="rgba(0, 245, 160, 0.5)" stroke-width="2" class="data-flow-line"/>

  <!-- Left: Student Node -->
  <g transform="translate(60, 120)">
    <rect width="120" height="80" rx="10" fill="#0B1324" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#0284C7" opacity="0.3"/>
    <text x="28" y="33" text-anchor="middle" font-size="14">🎓</text>
    <text x="50" y="26" class="node-title">STUDENT</text>
    <text x="50" y="38" fill="#38BDF8" font-size="8.5" font-family="sans-serif" font-weight="600">PORTAL</text>
    <text x="14" y="62" class="node-sub">Session Request</text>
    <text x="14" y="73" fill="#00F5A0" font-size="8" font-family="sans-serif">● Active Feedback</text>
  </g>

  <!-- Center: Core Mentrix Engine -->
  <g transform="translate(300, 160)">
    <g class="pulse-core">
      <circle r="44" fill="#0F172A" stroke="#00F2FE" stroke-width="2.5"/>
      <circle r="36" fill="#020617" stroke="rgba(127, 0, 255, 0.6)" stroke-width="1.5"/>
      <text y="-8" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="0.05em">MENTRIX</text>
      <text y="8" text-anchor="middle" fill="#00F2FE" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700">RBAC CORE</text>
      <circle cy="22" r="3" fill="#00F5A0" filter="url(#artGlow)"/>
    </g>
  </g>

  <!-- Right: Faculty Portal Node -->
  <g transform="translate(420, 120)">
    <rect width="120" height="80" rx="10" fill="#0B1324" stroke="rgba(127, 0, 255, 0.4)" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#7F00FF" opacity="0.3"/>
    <text x="28" y="33" text-anchor="middle" font-size="14">👨‍🏫</text>
    <text x="50" y="26" class="node-title">FACULTY</text>
    <text x="50" y="38" fill="#C084FC" font-size="8.5" font-family="sans-serif" font-weight="600">MENTOR</text>
    <text x="14" y="62" class="node-sub">Slot Scheduling</text>
    <text x="14" y="73" fill="#38BDF8" font-size="8" font-family="sans-serif">● Guidance Logs</text>
  </g>

  <!-- Top: HOD and Institutional Governance -->
  <g transform="translate(230, 25)">
    <rect width="140" height="50" rx="8" fill="#090E1A" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>
    <text x="18" y="22" class="node-title">🏛️ HOD GOVERNANCE</text>
    <text x="18" y="38" class="node-sub">Department Analytics &amp; Audits</text>
  </g>

  <!-- Bottom: Local AI and ReportLab Telemetry -->
  <g transform="translate(210, 245)">
    <rect width="180" height="52" rx="8" fill="#090E1A" stroke="rgba(0, 245, 160, 0.3)" stroke-width="1"/>
    <text x="16" y="22" fill="#00F5A0" font-family="sans-serif" font-size="10.5" font-weight="700">🧠 OLLAMA LOCAL AI + PDF</text>
    <text x="16" y="38" class="node-sub">On-Premise Sentiment &amp; Transcripts</text>
  </g>
</svg>
