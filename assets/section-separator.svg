<svg fill="none" viewBox="0 0 900 24" width="100%" height="24" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7F00FF" stop-opacity="1"/>
      <stop offset="85%" stop-color="#00F5A0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .base-line {
      stroke: url(#lineBase);
      stroke-width: 1;
    }
    .pulse-beam {
      stroke: url(#beamGrad);
      stroke-width: 2.5;
      stroke-linecap: round;
      filter: url(#glow);
      stroke-dasharray: 140 760;
      animation: traverse 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .center-node {
      fill: #070B14;
      stroke: #00F2FE;
      stroke-width: 1.5;
      animation: pulseNode 3s ease-in-out infinite alternate;
    }
    .center-dot {
      fill: #00F5A0;
      animation: pulseDot 2s ease-in-out infinite alternate;
    }

    @keyframes traverse {
      0% { stroke-dashoffset: 900; }
      100% { stroke-dashoffset: -900; }
    }
    @keyframes pulseNode {
      0% { transform: scale(0.9); transform-origin: 450px 12px; }
      100% { transform: scale(1.15); transform-origin: 450px 12px; stroke: #7F00FF; }
    }
    @keyframes pulseDot {
      0% { fill: #00F2FE; }
      100% { fill: #00F5A0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse-beam, .center-node, .center-dot {
        animation: none !important;
      }
    }
  </style>

  <!-- Static base grid line -->
  <line x1="0" y1="12" x2="900" y2="12" class="base-line"/>
  
  <!-- Animated traversing glow beam -->
  <line x1="0" y1="12" x2="900" y2="12" class="pulse-beam"/>

  <!-- Center tech crystal node -->
  <polygon points="450,5 457,12 450,19 443,12" class="center-node"/>
  <circle cx="450" cy="12" r="2.5" class="center-dot"/>
</svg>
