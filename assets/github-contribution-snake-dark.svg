  <defs>
    <linearGradient id="snakeHeadDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#00F5A0"/>
    </linearGradient>
    <filter id="snakeGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .bg-rect { fill: #04070E; rx: 12px; }
    .grid-cell-0 { fill: #0D1322; }
    .grid-cell-1 { fill: #064E3B; }
    .grid-cell-2 { fill: #047857; }
    .grid-cell-3 { fill: #10B981; }
    .grid-cell-4 { fill: #00F5A0; filter: drop-shadow(0 0 4px rgba(0, 245, 160, 0.5)); }
    
    .snake-body {
      fill: url(#snakeHeadDark);
      filter: url(#snakeGlowDark);
      animation: snakeMove 12s infinite linear;
    }
    .snake-eye {
      fill: #04070E;
    }

    @keyframes snakeMove {
      0%   { transform: translate(0px, 0px); }
      25%  { transform: translate(120px, 26px); }
      50%  { transform: translate(280px, -13px); }
      75%  { transform: translate(450px, 39px); }
      100% { transform: translate(650px, 13px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .snake-body { animation: none !important; }
    }
  </style>

