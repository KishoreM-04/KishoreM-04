<svg fill="none" viewBox="0 0 900 280" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .banner-container {
          position: relative;
          width: 100%;
          height: 280px;
          background: #060A13;
          background: radial-gradient(circle at 90% 20%, rgba(0, 242, 254, 0.16) 0%, transparent 45%),
                      radial-gradient(circle at 10% 80%, rgba(127, 0, 255, 0.18) 0%, transparent 40%),
                      linear-gradient(135deg, #070B14 0%, #0C1220 100%);
          border-radius: 14px;
          border: 1px solid rgba(0, 242, 254, 0.3);
          box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.7);
          box-sizing: border-box;
          padding: 28px 36px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          overflow: hidden;
        }

        .ambient-grid {
          position: absolute;
          inset: 0;
          background-image: 
            linear-gradient(to right, rgba(0, 242, 254, 0.04) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(0, 242, 254, 0.04) 1px, transparent 1px);
          background-size: 28px 28px;
          mask-image: radial-gradient(circle at 50% 50%, black 60%, transparent 95%);
          pointer-events: none;
        }

        .header-line {
          display: flex;
          align-items: center;
          justify-content: space-between;
          position: relative;
          z-index: 2;
        }

        .title-block {
          display: flex;
          align-items: center;
          gap: 12px;
        }

        .brand-logo {
          width: 44px;
          height: 44px;
          border-radius: 10px;
          background: linear-gradient(135deg, #00F2FE 0%, #7F00FF 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-weight: 900;
          font-size: 24px;
          box-shadow: 0 0 18px rgba(0, 242, 254, 0.4);
        }

        .brand-name {
          margin: 0;
          font-size: 26px;
          font-weight: 800;
          letter-spacing: -0.02em;
          color: #FFFFFF;
        }

        .brand-sub {
          font-size: 11.5px;
          color: #38BDF8;
          font-weight: 600;
          letter-spacing: 0.06em;
          text-transform: uppercase;
        }

        .flag-tag {
          padding: 5px 12px;
          border-radius: 999px;
          background: rgba(0, 245, 160, 0.1);
          border: 1px solid rgba(0, 245, 160, 0.35);
          color: #00F5A0;
          font-size: 11px;
          font-weight: 700;
          letter-spacing: 0.05em;
          text-transform: uppercase;
        }

        /* Middle Architectural Roles and Pillars */
        .roles-strip {
          position: relative;
          z-index: 2;
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 10px;
          margin: 10px 0;
        }

        .role-pill {
          background: rgba(255, 255, 255, 0.03);
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 8px;
          padding: 10px 12px;
          display: flex;
          flex-direction: column;
          gap: 2px;
        }

        .role-title {
          font-size: 11px;
          font-weight: 700;
          color: #F1F5F9;
        }
        .role-desc {
          font-size: 10px;
          color: #94A3B8;
        }

        /* Bottom Innovations and Badges */
        .bottom-innovations {
          position: relative;
          z-index: 2;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding-top: 12px;
          border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .innov-chips {
          display: flex;
          align-items: center;
          gap: 8px;
          flex-wrap: wrap;
        }

        .innov-chip {
          display: inline-flex;
          align-items: center;
          gap: 5px;
          font-size: 11px;
          font-weight: 600;
          color: #CBD5E1;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid rgba(255, 255, 255, 0.09);
          padding: 4px 9px;
          border-radius: 6px;
        }

        .innov-icon {
          color: #00F2FE;
        }

        .status-badge {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 11.5px;
          color: #38BDF8;
          font-weight: 600;
        }
        .pulse-beacon {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #00F2FE;
          box-shadow: 0 0 10px #00F2FE;
          animation: pulseBeacon 2s infinite ease-in-out;
        }

        @keyframes pulseBeacon {
          0%, 100% { opacity: 0.6; transform: scale(0.9); }
          50% { opacity: 1; transform: scale(1.25); }
        }

        @media (prefers-reduced-motion: reduce) {
          .pulse-beacon { animation: none !important; }
        }
      </style>

      <div class="banner-container">
        <div class="ambient-grid"></div>

        <!-- Header -->
        <div class="header-line">
          <div class="title-block">
            <div class="brand-logo">M</div>
            <div>
              <div class="brand-sub">Flagship Enterprise Architecture</div>
              <h2 class="brand-name">MENTRIX</h2>
            </div>
          </div>
          <span class="flag-tag">Institutional Mentor–Mentee Ecosystem</span>
        </div>

        <!-- 4 Role Pillars -->
        <div class="roles-strip">
          <div class="role-pill">
            <span class="role-title">🎓 Student Portal</span>
            <span class="role-desc">Session booking &amp; feedback</span>
          </div>
          <div class="role-pill">
            <span class="role-title">👨‍🏫 Faculty Suite</span>
            <span class="role-desc">Slot management &amp; notes</span>
          </div>
          <div class="role-pill">
            <span class="role-title">🏛️ HOD Governance</span>
            <span class="role-desc">Department audits &amp; reports</span>
          </div>
          <div class="role-pill">
            <span class="role-title">🛡️ Admin &amp; Security</span>
            <span class="role-desc">Role switching &amp; sessions</span>
          </div>
        </div>

        <!-- Innovations Bottom Strip -->
        <div class="bottom-innovations">
          <div class="innov-chips">
            <span class="innov-chip"><span class="innov-icon">🧠</span>Local Ollama AI Integration</span>
            <span class="innov-chip"><span class="innov-icon">🔐</span>Domain Google OAuth2</span>
            <span class="innov-chip"><span class="innov-icon">⚡</span>Single Session Guard</span>
            <span class="innov-chip"><span class="innov-icon">📄</span>ReportLab PDF Telemetry</span>
          </div>
          <div class="status-badge">
            <span class="pulse-beacon"></span>
            Production Architecture
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
