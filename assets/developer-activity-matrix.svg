<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="60%" stop-color="#081020"/>
      <stop offset="100%" stop-color="#03070E"/>
    </linearGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F2FE" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#7F00FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="nodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .telemetry-text {
      font-family: "JetBrains Mono", -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
    }
    .hud-label {
      fill: #64748B;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .hud-val {
      fill: #F8FAFC;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    /* Scanning Telemetry Beam */
    .scanner-line {
      animation: scanVertical 4s ease-in-out infinite alternate;
    }
    @keyframes scanVertical {
      0%   { transform: translateY(0); opacity: 0.2; }
      50%  { opacity: 0.8; }
      100% { transform: translateY(180px); opacity: 0.2; }
    }

    /* Pulse Dots */
    .pulse-node {
      animation: pulseAnim 3s infinite ease-in-out alternate;
    }
    .p-1 { animation-delay: 0s; }
    .p-2 { animation-delay: 0.8s; }
    .p-3 { animation-delay: 1.6s; }
    .p-4 { animation-delay: 2.2s; }

    @keyframes pulseAnim {
      0%   { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    /* Signal Traversing Lines */
    .data-path {
      stroke-dasharray: 8 16;
      animation: flowPath 20s linear infinite;
    }
    @keyframes flowPath {
      from { stroke-dashoffset: 400; }
      to   { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scanner-line, .pulse-node, .data-path {
        animation: none !important;
      }
    }
  </style>

  <!-- Background Outer Chassis -->
  <rect width="850" height="260" rx="14" fill="url(#matrixBg)" stroke="rgba(0, 242, 254, 0.25)" stroke-width="1.5"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.12" stroke="#00F2FE" stroke-width="0.75">
    <line x1="30" y1="50" x2="820" y2="50"/>
    <line x1="30" y1="100" x2="820" y2="100"/>
    <line x1="30" y1="150" x2="820" y2="150"/>
    <line x1="30" y1="200" x2="820" y2="200"/>
    <line x1="180" y1="35" x2="180" y2="230"/>
    <line x1="520" y1="35" x2="520" y2="230"/>
  </g>

  <!-- Header Status Bar -->
  <g transform="translate(32, 28)">
    <circle cx="0" cy="0" r="4.5" fill="#00F5A0" filter="url(#nodeGlow)"/>
    <text x="14" y="3" fill="#00F2FE" class="telemetry-text" font-size="11" font-weight="700" letter-spacing="0.1em">DEVELOPER ACTIVITY MATRIX // NEURAL TELEMETRY</text>
    <rect x="710" y="-8" width="76" height="18" rx="4" fill="rgba(0,245,160,0.12)" stroke="rgba(0,245,160,0.4)" stroke-width="1"/>
    <text x="722" y="5" fill="#00F5A0" class="telemetry-text" font-size="9.5" font-weight="700">ONLINE</text>
  </g>

  <!-- Vertical Scanning Laser in Constellation Area -->
  <g class="scanner-line">
    <line x1="190" y1="45" x2="510" y2="45" stroke="url(#laserBeam)" stroke-width="2" filter="url(#nodeGlow)"/>
  </g>

  <!-- Left: AI Telemetry Analysis Panel -->
  <g transform="translate(32, 60)">
    <rect width="136" height="170" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Mini AI Bot Avatar -->
    <g transform="translate(68, 42)">
      <circle cx="0" cy="0" r="24" fill="#0F172A" stroke="#00F2FE" stroke-width="1.5"/>
      <rect x="-14" y="-8" width="28" height="16" rx="6" fill="#050B14" stroke="#38BDF8" stroke-width="1"/>
      <circle cx="-6" cy="0" r="2.5" fill="#00F2FE"/>
      <circle cx="6" cy="0" r="2.5" fill="#00F2FE"/>
      <!-- Audio ears -->
      <rect x="-19" y="-5" width="3" height="10" rx="1.5" fill="#00F2FE"/>
      <rect x="16" y="-5" width="3" height="10" rx="1.5" fill="#00F2FE"/>
    </g>

    <text x="68" y="86" text-anchor="middle" fill="#38BDF8" class="telemetry-text" font-size="10.5" font-weight="700">AURA-01</text>
    <text x="68" y="100" text-anchor="middle" fill="#64748B" class="telemetry-text" font-size="8.5">ANALYZING ACTIVITY</text>

    <!-- Signal Gauges -->
    <g transform="translate(14, 118)">
      <rect width="108" height="3" rx="1.5" fill="#1E293B"/>
      <rect width="92" height="3" rx="1.5" fill="#00F2FE"/>
      <text x="0" y="16" fill="#94A3B8" class="telemetry-text" font-size="8.5">COMMIT SYNC</text>
      <text x="108" y="16" text-anchor="end" fill="#00F2FE" class="telemetry-text" font-size="8.5">100%</text>

      <rect y="26" width="108" height="3" rx="1.5" fill="#1E293B"/>
      <rect y="26" width="80" height="3" rx="1.5" fill="#00F5A0"/>
      <text x="0" y="42" fill="#94A3B8" class="telemetry-text" font-size="8.5">PIPELINE INTEGRITY</text>
      <text x="108" y="42" text-anchor="end" fill="#00F5A0" class="telemetry-text" font-size="8.5">99.8%</text>
    </g>
  </g>

  <!-- Center: Interactive Activity Constellation Matrix -->
  <g transform="translate(200, 60)">
    <rect width="305" height="170" rx="8" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Constellation Pathways -->
    <path d="M 40 85 L 100 45 L 170 95 L 245 40 L 265 110 L 205 135 L 125 130 Z" 
          stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.2" fill="none" class="data-path"/>
    <path d="M 100 45 L 205 135 M 170 95 L 125 130 M 40 85 L 170 95" 
          stroke="rgba(127, 0, 255, 0.35)" stroke-width="1" fill="none"/>

    <!-- Constellation Activity Nodes -->
    <!-- Node 1: Mentrix Core -->
    <g transform="translate(40, 85)" class="pulse-node p-1">
      <circle r="7" fill="#0B132B" stroke="#00F2FE" stroke-width="2"/>
      <circle r="3.5" fill="#00F2FE" filter="url(#nodeGlow)"/>
    </g>
    <text x="40" y="105" text-anchor="middle" fill="#94A3B8" class="telemetry-text" font-size="8.5" font-weight="600">MENTRIX</text>

    <!-- Node 2: IoT Telemetry -->
    <g transform="translate(100, 45)" class="pulse-node p-2">
      <circle r="6" fill="#0B132B" stroke="#00F5A0" stroke-width="2"/>
      <circle r="3" fill="#00F5A0" filter="url(#nodeGlow)"/>
    </g>
    <text x="100" y="32" text-anchor="middle" fill="#94A3B8" class="telemetry-text" font-size="8.5" font-weight="600">IoT ROBOT</text>

    <!-- Node 3: Full-Stack Commerce -->
    <g transform="translate(170, 95)" class="pulse-node p-3">
      <circle r="8" fill="#0B132B" stroke="#7F00FF" stroke-width="2"/>
      <circle r="4" fill="#C084FC" filter="url(#nodeGlow)"/>
    </g>
    <text x="170" y="115" text-anchor="middle" fill="#94A3B8" class="telemetry-text" font-size="8.5" font-weight="600">DELIVERY API</text>

    <!-- Node 4: TaskFlow Engine -->
    <g transform="translate(245, 40)" class="pulse-node p-4">
      <circle r="6" fill="#0B132B" stroke="#00F2FE" stroke-width="2"/>
      <circle r="3" fill="#00F2FE" filter="url(#nodeGlow)"/>
    </g>
    <text x="245" y="28" text-anchor="middle" fill="#94A3B8" class="telemetry-text" font-size="8.5" font-weight="600">TASKFLOW</text>

    <!-- Node 5: Warehouse Logistics -->
    <g transform="translate(265, 110)" class="pulse-node p-1">
      <circle r="5.5" fill="#0B132B" stroke="#FBBF24" stroke-width="2"/>
      <circle r="2.5" fill="#FBBF24" filter="url(#nodeGlow)"/>
    </g>
    <text x="265" y="128" text-anchor="middle" fill="#94A3B8" class="telemetry-text" font-size="8.5" font-weight="600">WAREHOUSE</text>

    <!-- Node 6: Mobile Fest Apps -->
    <g transform="translate(205, 135)" class="pulse-node p-2">
      <circle r="5.5" fill="#0B132B" stroke="#C084FC" stroke-width="2"/>
      <circle r="2.5" fill="#C084FC"/>
    </g>
    <text x="205" y="152" text-anchor="middle" fill="#94A3B8" class="telemetry-text" font-size="8.5" font-weight="600">SPLENDORE</text>

    <!-- Node 7: Applied AI Helper -->
    <g transform="translate(125, 130)" class="pulse-node p-3">
      <circle r="5.5" fill="#0B132B" stroke="#00F2FE" stroke-width="2"/>
      <circle r="2.5" fill="#00F2FE"/>
    </g>
    <text x="125" y="148" text-anchor="middle" fill="#94A3B8" class="telemetry-text" font-size="8.5" font-weight="600">GPT HELPER</text>
  </g>

  <!-- Right: Verified System Telemetry Grid -->
  <g transform="translate(535, 60)">
    <rect width="283" height="170" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- 4 Structured Telemetry Rows -->
    <g transform="translate(18, 22)">
      <text class="telemetry-text hud-label">SYSTEM REPOSITORIES</text>
      <text y="16" class="telemetry-text hud-val">11 Public Repositories (Verified)</text>
    </g>

    <g transform="translate(18, 62)">
      <text class="telemetry-text hud-label">FEATURED ARCHITECTURES</text>
      <text y="16" class="telemetry-text hud-val">8 Engineered Modules</text>
    </g>

    <g transform="translate(18, 102)">
      <text class="telemetry-text hud-label">RESEARCH &amp; CONFERENCES</text>
      <text y="16" class="telemetry-text hud-val">2 Published Papers (AI / Robotics)</text>
    </g>

    <g transform="translate(18, 142)">
      <text class="telemetry-text hud-label">ACADEMIC STATUS</text>
      <text y="16" class="telemetry-text hud-val">MCA Scholar · Rajagiri (2027)</text>
    </g>
  </g>
</svg>
