<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040813"/>
      <stop offset="100%" stop-color="#07101E"/>
    </linearGradient>
    <linearGradient id="sensorFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>
    <filter id="iotGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .sensor-stream {
      stroke-dasharray: 6 10;
      animation: streamFlow 4s linear infinite;
    }
    @keyframes streamFlow {
      from { stroke-dashoffset: 48; }
      to   { stroke-dashoffset: 0; }
    }
    .wifi-wave {
      animation: waveExpand 2s infinite ease-out;
      transform-origin: 295px 150px;
    }
    @keyframes waveExpand {
      0%   { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sensor-stream, .wifi-wave { animation: none !important; }
    }
  </style>

  <!-- Base Chassis -->
  <rect width="600" height="320" rx="14" fill="url(#iotBg)" stroke="rgba(0, 245, 160, 0.3)" stroke-width="1.5"/>

  <!-- Left: Environmental Sensors & Air Quality Ingestion -->
  <g transform="translate(35, 75)">
    <rect width="130" height="170" rx="10" fill="#0A1326" stroke="rgba(0, 245, 160, 0.4)" stroke-width="1.5"/>
    <text x="16" y="26" fill="#00F5A0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">📡 SENSOR ARRAY</text>
    <text x="16" y="40" fill="#64748B" font-family="sans-serif" font-size="8.5">Real-Time Ingestion</text>

    <!-- Gauge 1: PM2.5 -->
    <g transform="translate(16, 55)">
      <text fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600">PM2.5 / PM10</text>
      <rect y="8" width="98" height="4" rx="2" fill="#1E293B"/>
      <rect y="8" width="76" height="4" rx="2" fill="#00F5A0"/>
      <text y="24" fill="#00F5A0" font-family="sans-serif" font-size="8.5">18 µg/m³ · Clean</text>
    </g>

    <!-- Gauge 2: Gas & VOC -->
    <g transform="translate(16, 95)">
      <text fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600">MQ-135 Gas / VOC</text>
      <rect y="8" width="98" height="4" rx="2" fill="#1E293B"/>
      <rect y="8" width="45" height="4" rx="2" fill="#00F2FE"/>
      <text y="24" fill="#00F2FE" font-family="sans-serif" font-size="8.5">412 ppm · Normal</text>
    </g>

    <!-- Gauge 3: Temp & Humidity -->
    <g transform="translate(16, 135)">
      <text fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600">DHT-22 Temp/RH</text>
      <rect y="8" width="98" height="4" rx="2" fill="#1E293B"/>
      <rect y="8" width="60" height="4" rx="2" fill="#7F00FF"/>
      <text y="24" fill="#C084FC" font-family="sans-serif" font-size="8.5">26.4°C · 58% RH</text>
    </g>
  </g>

  <!-- Flow Line: Sensors to ESP32 -->
  <path d="M 165 160 L 235 160" stroke="url(#sensorFlow)" stroke-width="2.5" class="sensor-stream"/>

  <!-- Center: ESP32 Microcontroller Node -->
  <g transform="translate(235, 105)">
    <rect width="120" height="110" rx="10" fill="#0F172A" stroke="#00F2FE" stroke-width="2"/>
    <text x="60" y="24" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="800">ESP32 CORE</text>
    <text x="60" y="37" text-anchor="middle" fill="#00F2FE" font-family="sans-serif" font-size="8.5" font-weight="600">TELEMETRY CONTROLLER</text>

    <!-- Microchip Pins Representation -->
    <g fill="#475569">
      <rect x="15" y="50" width="8" height="14" rx="1"/>
      <rect x="29" y="50" width="8" height="14" rx="1"/>
      <rect x="43" y="50" width="8" height="14" rx="1"/>
      <rect x="57" y="50" width="8" height="14" rx="1"/>
      <rect x="71" y="50" width="8" height="14" rx="1"/>
      <rect x="85" y="50" width="8" height="14" rx="1"/>
    </g>

    <!-- Wireless Radio Pulse Wave -->
    <circle cx="60" cy="85" r="14" stroke="#00F2FE" stroke-width="1.5" fill="none" class="wifi-wave"/>
    <circle cx="60" cy="85" r="5" fill="#00F2FE" filter="url(#iotGlow)"/>
    <text x="60" y="103" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="7.5">WIRELESS COMMS</text>
  </g>

  <!-- Flow Line: ESP32 to Android Mobile Interface -->
  <path d="M 355 160 L 425 160" stroke="url(#sensorFlow)" stroke-width="2.5" class="sensor-stream"/>

  <!-- Right: Android Remote Control Interface & Robot Drive -->
  <g transform="translate(425, 75)">
    <rect width="140" height="170" rx="10" fill="#0A1326" stroke="rgba(0, 242, 254, 0.4)" stroke-width="1.5"/>
    <text x="16" y="24" fill="#00F2FE" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">📱 MOBILE REMOTE</text>
    <text x="16" y="38" fill="#64748B" font-family="sans-serif" font-size="8.5">EcoBreath Android App</text>

    <!-- Tactile D-Pad Controller -->
    <g transform="translate(70, 90)">
      <!-- Up -->
      <polygon points="0,-22 9,-10 -9,-10" fill="#0284C7"/>
      <!-- Down -->
      <polygon points="0,22 9,10 -9,10" fill="#0284C7"/>
      <!-- Left -->
      <polygon points="-22,0 -10,-9 -10,9" fill="#0284C7"/>
      <!-- Right -->
      <polygon points="22,0 10,-9 10,9" fill="#0284C7"/>
      <!-- Center Stop / Purify Mode -->
      <circle r="8" fill="#00F5A0"/>
    </g>

    <text x="70" y="132" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="9" font-weight="600">DIRECTIONAL DRIVE</text>
    
    <!-- Fan Speed Status -->
    <g transform="translate(14, 145)">
      <rect width="112" height="16" rx="4" fill="#1E293B"/>
      <text x="8" y="12" fill="#00F5A0" font-family="sans-serif" font-size="8.5" font-weight="700">TURBO PURIFICATION ON</text>
    </g>
  </g>

  <!-- Footer Tagline -->
  <text x="300" y="300" text-anchor="middle" fill="#64748B" font-family="-apple-system, sans-serif" font-size="10.5">
    Autonomous Robotic Base · ESP32 Sensor Ingestion · Wireless Android Java Telemetry
  </text>
</svg>
