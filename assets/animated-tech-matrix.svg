<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Card Gradients -->
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B17"/>
      <stop offset="100%" stop-color="#02060F"/>
    </linearGradient>

    <!-- Pillar Gradients -->
    <linearGradient id="colCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#060E1D"/>
    </linearGradient>
    <linearGradient id="colGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081E19"/>
      <stop offset="100%" stop-color="#04120F"/>
    </linearGradient>
    <linearGradient id="colPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160C29"/>
      <stop offset="100%" stop-color="#0A0515"/>
    </linearGradient>
    <linearGradient id="colBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1C33"/>
      <stop offset="100%" stop-color="#050E1A"/>
    </linearGradient>

    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Scanline pulse across pillars */
    .scan-beam {
      animation: beamSweep 4s ease-in-out infinite alternate;
    }
    @keyframes beamSweep {
      0%   { opacity: 0.3; transform: scaleX(0.7); }
      100% { opacity: 1; transform: scaleX(1); }
    }

    /* Live status dot pulse */
    .pulse-dot {
      animation: dotPulse 2s ease-in-out infinite alternate;
    }
    @keyframes dotPulse {
      0%   { opacity: 0.5; }
      100% { opacity: 1; filter: drop-shadow(0 0 5px #00F2FE); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scan-beam, .pulse-dot { animation: none !important; }
    }
  </style>

  <!-- Canvas Chassis -->
  <rect width="880" height="230" rx="14" fill="url(#matrixBg)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.6"/>

  <!-- Top Marquee Header -->
  <g transform="translate(24, 26)">
    <text fill="#00F2FE" class="mono" font-size="11" font-weight="800" letter-spacing="0.1em">⚡ VERIFIED TECHNICAL ARSENAL // CORE COMPETENCIES</text>
    <rect x="710" y="-12" width="120" height="20" rx="4" fill="rgba(0,242,254,0.08)" stroke="rgba(0,242,254,0.3)" stroke-width="0.8"/>
    <circle cx="722" cy="-2" r="3" fill="#00F2FE" class="pulse-dot"/>
    <text x="774" y="2" text-anchor="middle" fill="#00F2FE" class="mono" font-size="9" font-weight="700">SYNCHRONIZED</text>
  </g>
  <line x1="24" y1="40" x2="856" y2="40" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- ==================== PILLAR 1: BACKEND SYSTEMS ==================== -->
  <g transform="translate(24, 54)">
    <rect width="198" height="156" rx="10" fill="url(#colCyan)" stroke="rgba(0, 242, 254, 0.35)" stroke-width="1.2"/>
    <line x1="12" y1="0" x2="186" y2="0" stroke="#00F2FE" stroke-width="2" class="scan-beam"/>

    <!-- Icon and Title -->
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#040D1B" stroke="#00F2FE" stroke-width="1"/>
    <text x="28" y="33" text-anchor="middle" font-size="14">⚡</text>
    <text x="50" y="26" fill="#FFFFFF" class="sans" font-size="12" font-weight="700">BACKEND</text>
    <text x="50" y="38" fill="#38BDF8" class="mono" font-size="9" font-weight="600">ENTERPRISE CORE</text>

    <!-- Skills Badges -->
    <g transform="translate(14, 56)">
      <rect x="0" y="0" width="58" height="20" rx="4" fill="#0E243F" stroke="rgba(0,242,254,0.25)" stroke-width="0.8"/>
      <text x="29" y="14" text-anchor="middle" fill="#E2E8F0" class="mono" font-size="9.5">Python</text>

      <rect x="64" y="0" width="70" height="20" rx="4" fill="#0E243F" stroke="rgba(0,242,254,0.25)" stroke-width="0.8"/>
      <text x="99" y="14" text-anchor="middle" fill="#00F2FE" class="mono" font-size="9.5" font-weight="600">Django 5</text>

      <rect x="140" y="0" width="46" height="20" rx="4" fill="#0E243F" stroke="rgba(0,242,254,0.25)" stroke-width="0.8"/>
      <text x="163" y="14" text-anchor="middle" fill="#E2E8F0" class="mono" font-size="9.5">Flask</text>

      <rect x="0" y="26" width="40" height="20" rx="4" fill="#0E243F" stroke="rgba(0,242,254,0.25)" stroke-width="0.8"/>
      <text x="20" y="40" text-anchor="middle" fill="#E2E8F0" class="mono" font-size="9.5">PHP</text>

      <rect x="46" y="26" width="42" height="20" rx="4" fill="#0E243F" stroke="rgba(0,242,254,0.25)" stroke-width="0.8"/>
      <text x="67" y="40" text-anchor="middle" fill="#E2E8F0" class="mono" font-size="9.5">Java</text>

      <rect x="94" y="26" width="38" height="20" rx="4" fill="#0E243F" stroke="rgba(0,242,254,0.25)" stroke-width="0.8"/>
      <text x="113" y="40" text-anchor="middle" fill="#E2E8F0" class="mono" font-size="9.5">C++</text>

      <rect x="138" y="26" width="30" height="20" rx="4" fill="#0E243F" stroke="rgba(0,242,254,0.25)" stroke-width="0.8"/>
      <text x="153" y="40" text-anchor="middle" fill="#E2E8F0" class="mono" font-size="9.5">C</text>

      <!-- Sub-spec info -->
      <text x="0" y="68" fill="#94A3B8" class="sans" font-size="8.5">RBAC · Concurrency Guards</text>
      <text x="0" y="81" fill="#38BDF8" class="mono" font-size="8.5">REST APIs · Gunicorn WSGI</text>
    </g>
  </g>

  <!-- ==================== PILLAR 2: RELATIONAL DATABASES ==================== -->
  <g transform="translate(236, 54)">
    <rect width="198" height="156" rx="10" fill="url(#colBlue)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
    <line x1="12" y1="0" x2="186" y2="0" stroke="#38BDF8" stroke-width="2" class="scan-beam"/>

    <!-- Icon and Title -->
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#051325" stroke="#38BDF8" stroke-width="1"/>
    <text x="28" y="33" text-anchor="middle" font-size="14">🗄️</text>
    <text x="50" y="26" fill="#FFFFFF" class="sans" font-size="12" font-weight="700">DATABASES</text>
    <text x="50" y="38" fill="#38BDF8" class="mono" font-size="9" font-weight="600">RELATIONAL PIPELINES</text>

    <!-- Skills Badges -->
    <g transform="translate(14, 56)">
      <rect x="0" y="0" width="56" height="20" rx="4" fill="#0A2242" stroke="rgba(56,189,248,0.25)" stroke-width="0.8"/>
      <text x="28" y="14" text-anchor="middle" fill="#38BDF8" class="mono" font-size="9.5" font-weight="600">MySQL</text>

      <rect x="62" y="0" width="80" height="20" rx="4" fill="#0A2242" stroke="rgba(56,189,248,0.25)" stroke-width="0.8"/>
      <text x="102" y="14" text-anchor="middle" fill="#E2E8F0" class="mono" font-size="9.5">PostgreSQL</text>

      <rect x="0" y="26" width="56" height="20" rx="4" fill="#0A2242" stroke="rgba(56,189,248,0.25)" stroke-width="0.8"/>
      <text x="28" y="40" text-anchor="middle" fill="#E2E8F0" class="mono" font-size="9.5">SQLite</text>

      <rect x="62" y="26" width="58" height="20" rx="4" fill="#0A2242" stroke="rgba(56,189,248,0.25)" stroke-width="0.8"/>
      <text x="91" y="40" text-anchor="middle" fill="#E2E8F0" class="mono" font-size="9.5">Oracle</text>

      <!-- Sub-spec info -->
      <text x="0" y="68" fill="#94A3B8" class="sans" font-size="8.5">Schema Normalization (3NF)</text>
      <text x="0" y="81" fill="#38BDF8" class="mono" font-size="8.5">Atomic Transactions · Indexing</text>
    </g>
  </g>

  <!-- ==================== PILLAR 3: MOBILE and IOT ==================== -->
  <g transform="translate(448, 54)">
    <rect width="198" height="156" rx="10" fill="url(#colGreen)" stroke="rgba(0, 245, 160, 0.35)" stroke-width="1.2"/>
    <line x1="12" y1="0" x2="186" y2="0" stroke="#00F5A0" stroke-width="2" class="scan-beam"/>

    <!-- Icon and Title -->
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#041B15" stroke="#00F5A0" stroke-width="1"/>
    <text x="28" y="33" text-anchor="middle" font-size="14">📡</text>
    <text x="50" y="26" fill="#FFFFFF" class="sans" font-size="12" font-weight="700">MOBILE &amp; IOT</text>
    <text x="50" y="38" fill="#00F5A0" class="mono" font-size="9" font-weight="600">CLIENT &amp; EMBEDDED</text>

    <!-- Skills Badges -->
    <g transform="translate(14, 56)">
      <rect x="0" y="0" width="86" height="20" rx="4" fill="#0A3326" stroke="rgba(0,245,160,0.25)" stroke-width="0.8"/>
      <text x="43" y="14" text-anchor="middle" fill="#00F5A0" class="mono" font-size="9.5" font-weight="600">Android Java</text>

      <rect x="92" y="0" width="56" height="20" rx="4" fill="#0A3326" stroke="rgba(0,245,160,0.25)" stroke-width="0.8"/>
      <text x="120" y="14" text-anchor="middle" fill="#E2E8F0" class="mono" font-size="9.5">Flutter</text>

      <rect x="0" y="26" width="54" height="20" rx="4" fill="#0A3326" stroke="rgba(0,245,160,0.25)" stroke-width="0.8"/>
      <text x="27" y="40" text-anchor="middle" fill="#00F5A0" class="mono" font-size="9.5" font-weight="600">ESP32</text>

      <rect x="60" y="26" width="70" height="20" rx="4" fill="#0A3326" stroke="rgba(0,245,160,0.25)" stroke-width="0.8"/>
      <text x="95" y="40" text-anchor="middle" fill="#E2E8F0" class="mono" font-size="9.5">IoT Sensors</text>

      <!-- Sub-spec info -->
      <text x="0" y="68" fill="#94A3B8" class="sans" font-size="8.5">Camera Overlays · Picasso Cache</text>
      <text x="0" y="81" fill="#00F5A0" class="mono" font-size="8.5">Motor Controls · Wireless Ingestion</text>
    </g>
  </g>

  <!-- ==================== PILLAR 4: AI and CLOUD DEVOPS ==================== -->
  <g transform="translate(660, 54)">
    <rect width="196" height="156" rx="10" fill="url(#colPurple)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.2"/>
    <line x1="12" y1="0" x2="184" y2="0" stroke="#C084FC" stroke-width="2" class="scan-beam"/>

    <!-- Icon and Title -->
    <rect x="14" y="14" width="28" height="28" rx="6" fill="#180A2E" stroke="#C084FC" stroke-width="1"/>
    <text x="28" y="33" text-anchor="middle" font-size="14">🤖</text>
    <text x="50" y="26" fill="#FFFFFF" class="sans" font-size="12" font-weight="700">AI &amp; CLOUD</text>
    <text x="50" y="38" fill="#C084FC" class="mono" font-size="9" font-weight="600">EDGE INTELLIGENCE</text>

    <!-- Skills Badges -->
    <g transform="translate(14, 56)">
      <rect x="0" y="0" width="80" height="20" rx="4" fill="#29124E" stroke="rgba(192,132,252,0.25)" stroke-width="0.8"/>
      <text x="40" y="14" text-anchor="middle" fill="#C084FC" class="mono" font-size="9.5" font-weight="600">Ollama LLM</text>

      <rect x="86" y="0" width="76" height="20" rx="4" fill="#29124E" stroke="rgba(192,132,252,0.25)" stroke-width="0.8"/>
      <text x="124" y="14" text-anchor="middle" fill="#E2E8F0" class="mono" font-size="9.5">ReportLab</text>

      <rect x="0" y="26" width="60" height="20" rx="4" fill="#29124E" stroke="rgba(192,132,252,0.25)" stroke-width="0.8"/>
      <text x="30" y="40" text-anchor="middle" fill="#E2E8F0" class="mono" font-size="9.5">Railway</text>

      <rect x="66" y="26" width="56" height="20" rx="4" fill="#29124E" stroke="rgba(192,132,252,0.25)" stroke-width="0.8"/>
      <text x="94" y="40" text-anchor="middle" fill="#C084FC" class="mono" font-size="9.5" font-weight="600">Git CI/CD</text>

      <!-- Sub-spec info -->
      <text x="0" y="68" fill="#94A3B8" class="sans" font-size="8.5">On-Premise Privacy Inference</text>
      <text x="0" y="81" fill="#C084FC" class="mono" font-size="8.5">Dynamic Dossiers · Cloud Deploy</text>
    </g>
  </g>
</svg>